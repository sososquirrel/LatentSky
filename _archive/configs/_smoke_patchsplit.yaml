# Smoke-test only (patch-split verification) -- NOT a real experiment.
# Small n_total_pieces so an epoch only touches a few real pieces.
name: _smoke_patchsplit
input_vars:
  - precipw
  - t2m
  - olrtoa
  - mse_500hPa
  - mse_850hPa
  - uzonal_500hPa
  - uzonal_850hPa
  - umeridional_500hPa
  - umeridional_850hPa
  - rain_log1p
target_prefix: rain_total
residual: false
lead_steps_15: 12

base_ch: 64
depth: 5
out_activation: softplus

patch_size: 128
patch_stride: null
batch_size: 64
num_epochs: 2
patience: 10
pieces_dir: /glade/derecho/scratch/sabramian/latentsky_pieces
n_total_pieces: 3

split_mode: patch
patch_split_seed: 1919810
patch_split_train_frac: 0.7
patch_split_val_frac: 0.15

two_head: true
olr_var_name: olrtoa
bce_weight: 1.0
fss_weight: 0.25
fss_threshold: 0.1
fss_sharpness: 20.0
fss_max_kernel_px: 33

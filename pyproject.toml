[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latentsky"
version = "0.1.0"
description = "Km-scale precipitation forecasting on DYAMOND, evaluated with a scale-decomposed cluster metric"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

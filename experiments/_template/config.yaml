name: <experiment name>
serves: R1
data:
  path: data/dyamond/...
  period: ["2016-08-01", "2016-09-10"]
model:
  checkpoint: data/checkpoints/...
metrics:
  threshold_mm_h: 1.0
  scales_km: [10, 20, 50, 100, 200, 500]
  lead_times_h: [3, 6, 12, 24]
fit:
  form: exp_decay          # POD(t)/POD(0) = exp(-t/tau)
output: data/eval/<experiment name>/

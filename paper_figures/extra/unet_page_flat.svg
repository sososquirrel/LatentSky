<svg viewBox="0 0 940 442" role="img" style="max-width:100%;height:auto;font-family:'IBM Plex Mono',monospace"
     aria-label="The two-head U-Net: five encoder stages from 64 channels at 128 squared down to 1024 at 8 squared, a 2048-channel bottleneck at 4 squared modulated by OLR FiLM conditioning, a mirrored decoder with skip concatenations, and two parallel output heads — a softplus rain head in millimeters and a wet/dry logit head.">
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrd" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" style="fill:#2166ac"/>
    </marker>
  </defs>
  <g fill="none" stroke="#1a1a1a" stroke-width="1.2">
    <!-- encoder boxes -->
    <rect x="150" y="56"  width="130" height="34"/>
    <rect x="150" y="114" width="130" height="34"/>
    <rect x="150" y="172" width="130" height="34"/>
    <rect x="150" y="230" width="130" height="34"/>
    <rect x="150" y="288" width="130" height="34"/>
    <!-- bottleneck -->
    <rect x="405" y="352" width="130" height="34"/>
    <!-- decoder boxes -->
    <rect x="660" y="288" width="130" height="34"/>
    <rect x="660" y="230" width="130" height="34"/>
    <rect x="660" y="172" width="130" height="34"/>
    <rect x="660" y="114" width="130" height="34"/>
    <rect x="660" y="56"  width="130" height="34"/>
    <!-- encoder down arrows -->
    <line x1="215" y1="90"  x2="215" y2="112" marker-end="url(#arr)"/>
    <line x1="215" y1="148" x2="215" y2="170" marker-end="url(#arr)"/>
    <line x1="215" y1="206" x2="215" y2="228" marker-end="url(#arr)"/>
    <line x1="215" y1="264" x2="215" y2="286" marker-end="url(#arr)"/>
    <!-- into / out of bottleneck -->
    <line x1="215" y1="322" x2="403" y2="366" marker-end="url(#arr)"/>
    <line x1="535" y1="366" x2="723" y2="324" marker-end="url(#arr)"/>
    <!-- decoder up arrows -->
    <line x1="725" y1="286" x2="725" y2="266" marker-end="url(#arr)"/>
    <line x1="725" y1="228" x2="725" y2="208" marker-end="url(#arr)"/>
    <line x1="725" y1="170" x2="725" y2="150" marker-end="url(#arr)"/>
    <line x1="725" y1="112" x2="725" y2="92"  marker-end="url(#arr)"/>
    <!-- skip connections -->
    <g stroke-dasharray="5 4">
      <line x1="282" y1="73"  x2="658" y2="73"  marker-end="url(#arr)"/>
      <line x1="282" y1="131" x2="658" y2="131" marker-end="url(#arr)"/>
      <line x1="282" y1="189" x2="658" y2="189" marker-end="url(#arr)"/>
      <line x1="282" y1="247" x2="658" y2="247" marker-end="url(#arr)"/>
      <line x1="282" y1="305" x2="658" y2="305" marker-end="url(#arr)"/>
    </g>
    <!-- input -->
    <line x1="215" y1="20" x2="215" y2="54" marker-end="url(#arr)"/>
  </g>
  <!-- two-head additions (deterministic color) -->
  <g fill="none" style="stroke:#2166ac" stroke-width="1.6">
    <rect x="812" y="34" width="118" height="36"/>
    <rect x="812" y="92" width="118" height="36"/>
    <line x1="792" y1="66" x2="810" y2="52" marker-end="url(#arrd)"/>
    <line x1="792" y1="80" x2="810" y2="110" marker-end="url(#arrd)"/>
    <polyline points="330,420 440,420 440,390" stroke-dasharray="5 4" marker-end="url(#arrd)"/>
  </g>
  <g style="fill:#2166ac" font-size="11.5" text-anchor="middle">
    <text x="871" y="49">rain head</text>
    <text x="871" y="63">softplus → mm</text>
    <text x="871" y="107">wet/dry head</text>
    <text x="871" y="121">logits</text>
  </g>
  <g style="fill:#2166ac" font-size="11.5">
    <text x="40" y="424">OLR (ch 2) → [mean, min] → FiLM (γ, β)</text>
  </g>
  <g fill="#1a1a1a" font-size="12.5" text-anchor="middle">
    <text x="215" y="78">64 ch</text>
    <text x="215" y="136">128 ch</text>
    <text x="215" y="194">256 ch</text>
    <text x="215" y="252">512 ch</text>
    <text x="215" y="310">1024 ch</text>
    <text x="470" y="374">2048 ch</text>
    <text x="725" y="78">64 ch</text>
    <text x="725" y="136">128 ch</text>
    <text x="725" y="194">256 ch</text>
    <text x="725" y="252">512 ch</text>
    <text x="725" y="310">1024 ch</text>
    <text x="470" y="65"  font-size="11.5">skip, concat</text>
    <text x="305" y="16" text-anchor="start">input 10 ch @ 128×128</text>
  </g>
  <g fill="#1a1a1a" font-size="11.5" text-anchor="end">
    <text x="140" y="78">128²</text>
    <text x="140" y="136">64²</text>
    <text x="140" y="194">32²</text>
    <text x="140" y="252">16²</text>
    <text x="140" y="310">8²</text>
    <text x="395" y="374">4²</text>
  </g>
  <g fill="#1a1a1a" font-size="11.5">
    <text x="225" y="105">pool ½</text>
    <text x="735" y="279">up ×2</text>
    <text x="735" y="221">up ×2</text>
    <text x="735" y="163">up ×2</text>
    <text x="735" y="105">up ×2</text>
    <text x="225" y="163">pool ½</text>
    <text x="225" y="221">pool ½</text>
    <text x="225" y="279">pool ½</text>
  </g>
  <g fill="#1a1a1a" font-size="11.5" text-anchor="middle">
    <text x="470" y="352" dy="-6">bottleneck</text>
  </g>
</svg>